name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: cra-payroll-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: cra-payroll-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            artifact: cra-payroll-darwin-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build binary
        run: |
          bun build --compile src/cli.ts \
            --target ${{ matrix.target }} \
            --outfile ${{ matrix.artifact }} \
            --external chromium-bidi \
            --external electron

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/cra-payroll-linux-x64
            artifacts/cra-payroll-darwin-arm64
            artifacts/cra-payroll-darwin-x64
